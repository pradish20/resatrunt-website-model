    <meta name="description" content="Official website of Green Family Restaurant. A welcoming destination for delicious food, memorable moments, and quality family dining. View our menu, gallery, and story." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:site_name" content="Green Family Restaurant" />
    <meta property="og:title" content="Green Family Restaurant | Good Food. Warm Moments. Family Together." />

    <!-- Typography: Playfair Display + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <!-- Schema.org Restaurant Structured Data (Placeholders used until real business details provided) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Green Family Restaurant",
      "image": "/logo-emblem.svg",
      "description": "A welcoming destination for delicious food, memorable moments and quality family dining.",
      "servesCuisine": ["Indian", "Multi-Cuisine", "Family Dining"],
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[RESTAURANT_STREET_ADDRESS_PLACEHOLDER]",
        "addressLocality": "[CITY_PLACEHOLDER]",
        "addressRegion": "[STATE_PLACEHOLDER]",
        "postalCode": "[POSTAL_CODE_PLACEHOLDER]",
        "addressCountry": "[COUNTRY_PLACEHOLDER]"
      },
      "telephone": "[RESTAURANT_PHONE_PLACEHOLDER]",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "11:00",
          "closes": "23:00"
        }
      ],
      "acceptsReservations": "True"
    }
    </script>
  </head>
  <body class="bg-[#FBFBF9] text-[#1A261D] antialiased selection:bg-[#14452F] selection:text-[#F4F5F0]">
